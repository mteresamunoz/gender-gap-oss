name: Cache warmer

on:
  schedule:
    - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Infer gender (resume from cache)
        run: python data/scripts/infer_gender.py

      - name: Fetch yearly contributions (resume)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python data/scripts/fetch_yearly_contributions.py

      - name: Seed database
        run: python data/scripts/seed_database.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || \
            git commit -m "data: cache warm $(date +'%Y-%m-%d')"

          # Use merge (not rebase) to avoid fatal conflicts on the binary SQLite DB.
          # If another workflow pushed while this one was running, merge will
          # create a merge commit instead of aborting on the binary file.
          git pull --no-rebase --no-edit origin main || true

          # If the DB has a merge conflict, keep our freshly-generated version.
          if git ls-files -u | grep -q "data/db/gender_gap.db"; then
            git checkout --ours data/db/gender_gap.db
            git add data/db/gender_gap.db
          fi

          # If any other files are still unmerged, keep the remote version
          # (they were generated by the other workflow and are just as valid).
          unmerged=$(git ls-files -u | awk '{print $4}' | sort -u | grep -v "data/db/gender_gap.db" || true)
          if [ -n "$unmerged" ]; then
            echo "$unmerged" | while read f; do
              git checkout --theirs "$f"
              git add "$f"
            done
          fi

          # Commit the merge resolution if anything was resolved
          if ! git diff --staged --quiet; then
            git commit -m "data: resolve merge $(date +'%Y-%m-%d')" --no-edit
          fi

          git push

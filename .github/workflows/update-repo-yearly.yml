name: Update repo yearly stats

on:
  schedule:
    - cron: '0 5 * * *'    # daily at 05:00 UTC (before countries at 06:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo-yearly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Fetch repo yearly stats (resumable)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python data/scripts/fetch_repo_yearly.py

      - name: Seed repo yearly data
        run: python data/scripts/seed_repo_yearly.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || \
            git commit -m "data: repo yearly update $(date +'%Y-%m-%d')"

          # Use merge (not rebase) to avoid fatal conflicts on the binary SQLite DB.
          git pull --no-rebase --no-edit origin main || true

          # If the DB has a merge conflict, keep our freshly-generated version.
          if git ls-files -u | grep -q "data/db/gender_gap.db"; then
            git checkout --ours data/db/gender_gap.db
            git add data/db/gender_gap.db
          fi

          # Resolve any remaining conflicts by keeping the remote version.
          unmerged=$(git ls-files -u | awk '{print $4}' | sort -u | grep -v "data/db/gender_gap.db" || true)
          if [ -n "$unmerged" ]; then
            echo "$unmerged" | while read f; do
              git checkout --theirs "$f"
              git add "$f"
            done
          fi

          if ! git diff --staged --quiet; then
            git commit -m "data: resolve merge $(date +'%Y-%m-%d')" --no-edit
          fi

          git push

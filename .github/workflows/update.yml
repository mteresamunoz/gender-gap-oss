name: Update gender gap data

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Fetch GitHub top 500
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python data/scripts/fetch_github.py

      - name: Fetch curated AI repo contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python data/scripts/fetch_repo_contributors.py

      - name: Infer gender
        run: python data/scripts/infer_gender.py

      - name: Fetch yearly contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python data/scripts/fetch_yearly_contributions.py

      - name: Seed database
        run: python data/scripts/seed_database.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: update $(date +'%Y-%m-%d')"
          git push
